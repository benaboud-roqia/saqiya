<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sāqiya — Rapport d'irrigation · تقرير السقي</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b1a2b; --ink-2: #44566f; --ink-3: #8696ad; --rule: #e1e7f0; --soft: #f5f8fc;
      --navy: #0b1d33; --blue: #1a6dff; --sky: #38bdf8; --green: #1f9d6b; --lime: #b5e05b; --amber: #e0a01c; --red: #e5484d;
      --sans: "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, sans-serif;
      --ar: "IBM Plex Sans Arabic", "Plus Jakarta Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #dfe6ef; color: var(--ink); font: 12.5px/1.5 var(--sans); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .ar { font-family: var(--ar); direction: rtl; unicode-bidi: isolate; }

    /* barre d'outils (non imprimée) */
    .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 18px;
      background: var(--navy); color: #fff; box-shadow: 0 4px 18px rgba(0, 0, 0, .25); }
    .bar a { color: #cfe0ff; text-decoration: none; font-weight: 700; margin-inline-end: auto; display: inline-flex; gap: 8px; align-items: center; }
    .bar a img { width: 26px; height: 26px; border-radius: 7px; }
    .bar label { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: #cfe0ff; }
    .bar input { height: 34px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .08); color: #fff; padding: 0 10px; font: inherit; color-scheme: dark; }
    .bar button { height: 36px; padding: 0 16px; border-radius: 8px; border: 0; font-weight: 800; cursor: pointer; font-family: var(--sans); }
    .bar #go { background: rgba(255, 255, 255, .14); color: #fff; }
    .bar #print { background: var(--lime); color: var(--navy); }

    /* page A4 */
    .page { width: min(210mm, 100%); margin: 22px auto 40px; background: #fff; box-shadow: 0 18px 50px -18px rgba(11, 29, 51, .45); position: relative; overflow: hidden; }
    .inner { padding: 0 14mm 14mm; }

    /* couverture */
    .cover { position: relative; color: #fff; padding: 12mm 14mm 9mm; background: linear-gradient(120deg, #0b1d33 0%, #0d3a4f 55%, #1a6dff 130%); overflow: hidden; }
    .cover::after { content: ""; position: absolute; width: 320px; height: 320px; inset-inline-end: -110px; top: -140px; border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, .35), transparent 65%); }
    .cover .wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 26px; }
    .c-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; position: relative; z-index: 1; }
    .c-brand { display: flex; align-items: center; gap: 12px; }
    .c-brand img { width: 52px; height: 52px; border-radius: 13px; box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .6); }
    .c-brand b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
    .c-brand small { display: block; color: #9fc4ea; font-size: 11px; }
    .c-id { text-align: end; font: 500 10.5px var(--mono); color: #9fc4ea; line-height: 1.6; }
    .c-id b { color: #fff; font-size: 12px; }
    .c-title { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin: 9mm 0 6mm; }
    .c-title h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
    .c-title h1 + p { margin: 4px 0 0; color: #cfe0ff; font-size: 12px; }
    .c-title .ar h1 { font-family: var(--ar); letter-spacing: 0; }
    .meta { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; border-radius: 10px; overflow: hidden;
      background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .18); }
    .meta div { padding: 7px 10px; background: rgba(11, 29, 51, .35); }
    .meta span { display: flex; justify-content: space-between; gap: 6px; color: #9fc4ea; font-size: 9.5px; font-weight: 600; }
    .meta b { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; }

    /* titres de section bilingues */
    h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 5.5mm 0 2.5mm; padding-bottom: 5px;
      font-size: 14px; font-weight: 800; color: var(--navy); border-bottom: 2px solid var(--navy); break-after: avoid; }
    h2 .num { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-inline-end: 8px; border-radius: 6px; background: var(--blue); color: #fff; font-size: 11px; }
    h2 .ar { font-size: 14px; font-weight: 700; color: var(--navy); }

    /* chiffres clés */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .k { position: relative; border: 1px solid var(--rule); border-radius: 10px; padding: 9px 10px 8px; background: #fff; break-inside: avoid; }
    .k::before { content: ""; position: absolute; inset-inline-start: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--c, var(--blue)); }
    .k .lb { display: flex; justify-content: space-between; gap: 6px; font-size: 9.5px; font-weight: 700; color: var(--ink-3); }
    .k .lb .ar { font-weight: 600; }
    .k b { display: block; margin-top: 3px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .k b small { font-size: 10.5px; color: var(--ink-3); font-weight: 700; margin-inline-start: 3px; }
    .k.money { background: #f2f9f5; border-color: #cfe8db; --c: var(--green); }

    /* graphique */
    .chartbox { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px 4px; break-inside: avoid; }
    svg.chart { width: 100%; height: 175px; direction: ltr; display: block; }
    .legend { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 10px; color: var(--ink-2); margin: 2px 0 4px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-inline-end: 5px; }

    /* tableaux */
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { padding: 5px 7px; border-bottom: 1px solid var(--rule); text-align: start; vertical-align: top; }
    thead th { background: var(--navy); color: #fff; font-weight: 700; font-size: 9.5px; line-height: 1.3; }
    thead th:first-child { border-start-start-radius: 7px; } thead th:last-child { border-start-end-radius: 7px; }
    thead th .ar { display: block; color: #9fc4ea; font-weight: 500; text-align: left; }
    thead th.n .ar { text-align: right; }
    tbody tr:nth-child(even) td { background: var(--soft); }
    td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
    tfoot td { font-weight: 800; border-top: 2px solid var(--navy); border-bottom: 0; background: #eef4ff; }
    tr { break-inside: avoid; }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 9.5px; font-weight: 800; white-space: nowrap; }
    .tag.ok { background: #e3f6ec; color: var(--green); } .tag.low { background: #fff3dc; color: #b07a00; } .tag.high { background: #fde7e8; color: var(--red); } .tag.na { background: var(--soft); color: var(--ink-3); }
    .risk { display: grid; grid-template-columns: 1fr 110px 40px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); break-inside: avoid; }
    .risk .bar2 { height: 7px; border-radius: 4px; background: var(--soft); overflow: hidden; }
    .risk .bar2 i { display: block; height: 100%; border-radius: 4px; background: var(--green); }
    .risk.moyen .bar2 i, .risk.modéré .bar2 i { background: var(--amber); } .risk.élevé .bar2 i { background: var(--red); }
    .risk b { text-align: end; font-variant-numeric: tabular-nums; }
    .note { color: var(--ink-2); font-size: 10.5px; margin: 0; }
    .empty-s { padding: 10px; border: 1px dashed var(--rule); border-radius: 8px; color: var(--ink-3); text-align: center; font-size: 10.5px; }
    .empty-s .ar { display: block; }

    /* recommandations */
    .recos { display: grid; gap: 6px; }
    .reco { display: grid; grid-template-columns: 22px 1fr 1fr; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--soft); border-inline-start: 3px solid var(--c, var(--blue)); break-inside: avoid; }
    .reco .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--c, var(--blue)); color: #fff; font-weight: 800; font-size: 11px; }
    .reco.warn { --c: var(--amber); } .reco.bad { --c: var(--red); } .reco.good { --c: var(--green); }

    /* signatures et pied */
    .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; margin-top: 6mm; break-inside: avoid; break-after: avoid; }
    .sign div { border: 1px solid var(--rule); border-radius: 10px; height: 20mm; padding: 7px 10px; display: flex; justify-content: space-between; color: var(--ink-3); font-size: 10px; font-weight: 700; }
    .foot { margin-top: 4mm; break-before: avoid; padding-top: 6px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink-3); font-size: 9.5px; }
    .foot img { width: 16px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-inline-end: 5px; }
    .empty { padding: 60px 20px; text-align: center; color: var(--ink-3); }

    @media print {
      @page { size: A4; margin: 10mm 0 12mm; }
      @page :first { margin-top: 0; }
      .cover, .kpis, .chartbox, .two > div > table, .recos { break-inside: avoid; }
      body { background: #fff; }
      .bar { display: none; }
      .page { box-shadow: none; margin: 0; width: auto; overflow: visible; }
    }
    @media screen and (max-width: 760px) {
      .kpis, .meta { grid-template-columns: 1fr 1fr; }
      .two, .sign { grid-template-columns: 1fr; }
      .inner { padding: 0 14px 18px; } .cover { padding: 18px 14px 14px; }
      .c-title { flex-direction: column; align-items: flex-start; }
      .reco { grid-template-columns: 22px 1fr; } .reco .ar { grid-column: 2; }
      .bar a { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="/app/"><img src="logo.svg" alt="">← Tableau de bord · لوحة التحكم</a>
    <label>Du · من <input type="date" id="from"></label>
    <label>au · إلى <input type="date" id="to"></label>
    <button id="go" type="button">Afficher · عرض</button>
    <button id="print" type="button">Imprimer / PDF · طباعة</button>
  </div>
  <article class="page" id="page"><div class="empty">Chargement du rapport… · جارٍ تحميل التقرير…</div></article>
  <script>
  (function () {
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const num = (v, d = 0) => v == null || isNaN(v) ? "—" : (+v).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
    const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const today = new Date();
    const qs = new URLSearchParams(location.search);
    $("#from").value = qs.get("from") || iso(new Date(today.getFullYear(), today.getMonth(), 1));
    $("#to").value = qs.get("to") || iso(today);
    const dFR = (ts, o) => new Date(ts).toLocaleDateString("fr-FR", o);
    const dAR = (ts, o) => new Date(ts).toLocaleDateString("ar-DZ", o);
    const dur = (s) => s ? `${Math.floor(s / 3600) ? Math.floor(s / 3600) + " h " : ""}${Math.round((s % 3600) / 60)} min` : "—";
    // libellé bilingue : français à gauche, arabe à droite
    const bi = (fr, ar) => `<span>${fr}</span><span class="ar">${ar}</span>`;
    const H = (n, fr, ar) => `<h2><span><span class="num">${n}</span>${fr}</span><span class="ar">${ar}</span></h2>`;
    const th = (fr, ar, n) => `<th${n ? ' class="n"' : ""}>${fr}<span class="ar">${ar}</span></th>`;
    const empty = (fr, ar) => `<div class="empty-s">${fr}<span class="ar">${ar}</span></div>`;
    const split = (label) => (/^(.*?)\s*\((.*)\)$/.exec(label || "") || [null, label || "", ""]).slice(1);

    function chart(days) {
      if (!days.length) return empty("Aucune donnée sur cette période.", "لا توجد بيانات في هذه الفترة.");
      const W = 720, Hh = 175, L = 34, R = 30, B = 20, T = 10, bw = (W - L - R) / days.length;
      const maxL = Math.max(10, ...days.map((d) => d.litres || 0)) * 1.15;
      const Y = (v) => T + (1 - v / maxL) * (Hh - T - B), YM = (v) => T + (1 - v / 100) * (Hh - T - B);
      let s = "";
      for (let i = 0; i <= 4; i++) {
        const v = (maxL / 4) * i;
        s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e1e7f0"/><text x="${L - 5}" y="${Y(v) + 3}" font-size="9" text-anchor="end" fill="#8696ad">${Math.round(v)}</text>`;
        s += `<text x="${W - R + 5}" y="${YM(25 * i) + 3}" font-size="9" fill="#1f9d6b">${25 * i}%</text>`;
      }
      days.forEach((d, i) => {
        const x = L + i * bw, h = ((d.litres || 0) / maxL) * (Hh - T - B);
        s += `<rect x="${x + bw * 0.16}" y="${Hh - B - h}" width="${bw * 0.68}" height="${Math.max(h, 0.6)}" rx="2.5" fill="url(#gb)"/>`;
        if (days.length <= 16 || i % Math.ceil(days.length / 14) === 0) s += `<text x="${x + bw / 2}" y="${Hh - 6}" font-size="9" text-anchor="middle" fill="#8696ad">${new Date(d.day + "T12:00:00").getDate()}</text>`;
      });
      const pts = days.map((d, i) => d.m_avg != null ? [L + i * bw + bw / 2, YM(d.m_avg)] : null).filter(Boolean);
      if (pts.length) s += `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="#1f9d6b" stroke-width="2.2" stroke-linejoin="round"/>` +
        pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="#fff" stroke="#1f9d6b" stroke-width="1.6"/>`).join("");
      return `<div class="chartbox"><div class="legend"><span><i style="background:#1a6dff"></i>Eau d'irrigation par jour (litres) · <i style="background:#1f9d6b"></i>Humidité moyenne du sol (%)</span>
        <span class="ar"><i style="background:#1a6dff"></i>ماء السقي في اليوم (لتر) · <i style="background:#1f9d6b"></i>متوسط رطوبة التربة (%)</span></div>
        <svg class="chart" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1a6dff"/></linearGradient></defs>${s}</svg></div>`;
    }

    // avis sur une valeur du sol par rapport à sa plage idéale
    function verdict(v, lo, hi) {
      if (v == null) return `<span class="tag na">—</span>`;
      if (lo != null && v < lo) return `<span class="tag low">bas · منخفض</span>`;
      if (hi != null && v > hi) return `<span class="tag high">élevé · مرتفع</span>`;
      return `<span class="tag ok">bon · جيد</span>`;
    }

    // recommandations automatiques, en français et en arabe
    function recos(d) {
      const out = [], soil = d.soil || {}, id = d.ideal || {}, nut = id.nutrients || {}, t = d.totals;
      const add = (cls, fr, ar) => out.push({ cls, fr, ar });
      if (id.ph && soil.ph != null && soil.ph < id.ph[0]) add("warn", `Sol trop acide (pH ${num(soil.ph, 1)}) : un amendement calcaire progressif est conseillé.`, `التربة حمضية جدا (pH ${num(soil.ph, 1)}): يُنصح بإضافة تعديل كلسي تدريجي.`);
      if (id.ph && soil.ph != null && soil.ph > id.ph[1]) add("warn", `Sol trop alcalin (pH ${num(soil.ph, 1)}) : apport de matière organique ou de soufre conseillé.`, `التربة قلوية جدا (pH ${num(soil.ph, 1)}): يُنصح بإضافة مادة عضوية أو كبريت.`);
      if (id.ec_max != null && soil.ec != null && soil.ec > id.ec_max) add("bad", `Salinité élevée (${num(soil.ec, 2)} dS/m) : arrosages plus longs et moins fréquents pour lessiver les sels.`, `ملوحة مرتفعة (${num(soil.ec, 2)} dS/m): سقي أطول وأقل تكرارا لغسل الأملاح.`);
      const nk = { n: ["N", "d'azote", "الآزوت"], p: ["P", "de phosphore", "الفوسفور"], k: ["K", "de potassium", "البوتاسيوم"] };
      for (const [f, [K, fr, ar]] of Object.entries(nk)) {
        const r = nut[K];
        if (r && soil[f] != null && soil[f] < r.low) add("warn", `Manque ${fr} (${num(soil[f])} mg/kg, idéal ${r.low}–${r.high}) : apport d'engrais riche en ${K}.`, `نقص في ${ar} (${num(soil[f])} ملغ/كغ، المثالي ${r.low}–${r.high}): أضف سمادا غنيا بـ ${K}.`);
      }
      const high = (d.diseases || []).filter((x) => x.level === "élevé");
      if (high.length) add("bad", `Risque élevé de ${high.map((x) => split(x.label)[0]).join(", ")} : traitement préventif et aération de la culture.`, `خطر مرتفع لـ ${high.map((x) => split(x.label)[1] || x.label).join("، ")}: علاج وقائي وتهوية المزروعات.`);
      if (t.irrigations === 0) add("", "Aucun arrosage sur la période : vérifiez que le boîtier envoie ses mesures et que le mode automatique est actif.", "لا يوجد أي سقي في هذه الفترة: تحقق من أن الجهاز يرسل قياساته وأن الوضع التلقائي مفعل.");
      if (!out.length) add("good", "Les mesures de la période sont dans les plages idéales : continuer la conduite actuelle.", "قياسات الفترة ضمن المجالات المثالية: واصل الطريقة الحالية.");
      return `<div class="recos">${out.map((r, i) => `<div class="reco ${r.cls}"><span class="ic">${i + 1}</span><span>${esc(r.fr)}</span><span class="ar">${esc(r.ar)}</span></div>`).join("")}</div>`;
    }

    async function load() {
      const r = await fetch(`/api/report?from=${$("#from").value}&to=${$("#to").value}`, { cache: "no-store" });
      if (r.status === 401) return location.replace("/login?next=/app/report.html");
      const d = await r.json();
      if (!r.ok) { $("#page").innerHTML = `<div class="empty">${esc(d.error)}</div>`; return; }
      const t = d.totals, c = t.currency, s = d.settings, soil = d.soil || {}, id = d.ideal || {}, nut = id.nutrients || {};
      const f = d.period.from * 1000, to = d.period.to * 1000 - 1;
      const o = { day: "numeric", month: "long", year: "numeric" };
      const [crFR, crAR] = split(d.crop_label), [soFR, soAR] = split(d.soil_label);
      const modeName = { auto: ["Automatique", "تلقائي"], manuel: ["Manuel", "يدوي"], "programmé": ["Programmé", "مبرمج"] };
      const kpi = (fr, ar, val, unit, cls = "", color = "") => `<div class="k ${cls}" ${color ? `style="--c:${color}"` : ""}><span class="lb">${bi(fr, ar)}</span><b>${val}${unit ? `<small>${unit}</small>` : ""}</b></div>`;

      $("#page").innerHTML = `
        <section class="cover">
          <div class="c-top">
            <div class="c-brand"><img src="logo.svg" alt=""><div><b>Sāqiya <span class="ar">الساقية</span></b><small>Irrigation intelligente · السقي الذكي</small></div></div>
            <div class="c-id">N° <b>${esc(d.report_id)}</b><br>${esc(new Date().toLocaleString("fr-FR", { ...o, hour: "2-digit", minute: "2-digit" }))}</div>
          </div>
          <div class="c-title">
            <div><h1>Rapport d'irrigation</h1><p>${esc(dFR(f, o))} – ${esc(dFR(to, o))}</p></div>
            <div class="ar"><h1>تقرير السقي</h1><p>${esc(dAR(f, o))} – ${esc(dAR(to, o))}</p></div>
          </div>
          <div class="meta">
            <div><span>${bi("Exploitant", "الفلاح")}</span><b>${esc(d.account?.name || "—")}</b></div>
            <div><span>${bi("Culture", "الزراعة")}</span><b>${esc(crFR)}${crAR ? ` · <span class="ar">${esc(crAR)}</span>` : ""}</b></div>
            <div><span>${bi("Type de sol", "نوع التربة")}</span><b>${esc(soFR)}${soAR ? ` · <span class="ar">${esc(soAR)}</span>` : ""}</b></div>
            <div><span>${bi("Parcelle (GPS)", "الحقل")}</span><b>${num(s.latitude, 3)} · ${num(s.longitude, 3)}</b></div>
          </div>
          <svg class="wave" viewBox="0 0 800 26" preserveAspectRatio="none"><path d="M0 14 C 160 30 320 0 480 12 S 720 24 800 8 V26 H0 Z" fill="#fff"/></svg>
        </section>
        <div class="inner">
          ${H(1, "En résumé", "الملخص")}
          <div class="kpis">
            ${kpi("Arrosages", "عدد مرات السقي", t.irrigations, "", "", "#1a6dff")}
            ${kpi("Temps de pompage", "مدة الضخ", esc(dur(t.seconds)), "", "", "#38bdf8")}
            ${kpi("Eau utilisée", "الماء المستعمل", num(t.litres), "L", "", "#1a6dff")}
            ${kpi("Électricité", "الكهرباء", num(t.kwh, 1), "kWh", "", "#e0a01c")}
            ${kpi("Coût de l'eau", "تكلفة الماء", num(t.water_cost, 2), esc(c), "money")}
            ${kpi("Coût de l'électricité", "تكلفة الكهرباء", num(t.elec_cost, 2), esc(c), "money")}
            ${kpi("Coût total", "التكلفة الإجمالية", num(t.total_cost, 2), esc(c), "money")}
            ${kpi("Eau par jour", "الماء في اليوم", num(d.days.length ? t.litres / d.days.length : 0), "L", "", "#38bdf8")}
          </div>

          ${H(2, "Eau et humidité, jour par jour", "الماء والرطوبة يوما بيوم")}
          ${chart(d.days)}
          ${d.days.length ? `<table style="margin-top:4mm">
            <thead><tr>${th("Jour", "اليوم")}${th("Arrosages", "السقي", 1)}${th("Pompage", "الضخ", 1)}${th("Eau (L)", "الماء (ل)", 1)}${th(`Coût (${esc(c)})`, "التكلفة", 1)}${th("Humidité moy.", "متوسط الرطوبة", 1)}${th("T° min / max", "الحرارة", 1)}</tr></thead>
            <tbody>${d.days.map((x) => `<tr><td>${esc(dFR(x.day + "T12:00:00", { weekday: "short", day: "numeric", month: "short" }))}</td><td class="n">${x.n || 0}</td><td class="n">${esc(dur(x.s))}</td><td class="n">${num(x.litres)}</td><td class="n">${num(x.total_cost, 2)}</td><td class="n">${x.m_avg != null ? num(x.m_avg, 1) + " %" : "—"}</td><td class="n">${x.t_min != null ? num(x.t_min) + " / " + num(x.t_max) + " °C" : "—"}</td></tr>`).join("")}</tbody>
            <tfoot><tr><td>Total · المجموع</td><td class="n">${t.irrigations}</td><td class="n">${esc(dur(t.seconds))}</td><td class="n">${num(t.litres)}</td><td class="n">${num(t.total_cost, 2)}</td><td></td><td></td></tr></tfoot>
          </table>` : ""}

          <div class="two">
            <div>
              ${H(3, "Analyse du sol", "تحليل التربة")}
              <table>
                <thead><tr>${th("Mesure", "القياس")}${th("Moyenne", "المتوسط", 1)}${th("Idéal", "المثالي", 1)}${th("Avis", "التقييم", 1)}</tr></thead>
                <tbody>
                  <tr><td>pH</td><td class="n">${num(soil.ph, 1)}</td><td class="n">${id.ph ? num(id.ph[0], 1) + " – " + num(id.ph[1], 1) : "—"}</td><td class="n">${verdict(soil.ph, id.ph?.[0], id.ph?.[1])}</td></tr>
                  <tr><td>Salinité EC · <span class="ar">الملوحة</span></td><td class="n">${num(soil.ec, 2)} dS/m</td><td class="n">≤ ${num(id.ec_max, 1)}</td><td class="n">${verdict(soil.ec, null, id.ec_max)}</td></tr>
                  <tr><td>Azote N · <span class="ar">الآزوت</span></td><td class="n">${num(soil.n)} mg/kg</td><td class="n">${nut.N ? nut.N.low + " – " + nut.N.high : "—"}</td><td class="n">${verdict(soil.n, nut.N?.low, nut.N?.high)}</td></tr>
                  <tr><td>Phosphore P · <span class="ar">الفوسفور</span></td><td class="n">${num(soil.p)} mg/kg</td><td class="n">${nut.P ? nut.P.low + " – " + nut.P.high : "—"}</td><td class="n">${verdict(soil.p, nut.P?.low, nut.P?.high)}</td></tr>
                  <tr><td>Potassium K · <span class="ar">البوتاسيوم</span></td><td class="n">${num(soil.k)} mg/kg</td><td class="n">${nut.K ? nut.K.low + " – " + nut.K.high : "—"}</td><td class="n">${verdict(soil.k, nut.K?.low, nut.K?.high)}</td></tr>
                </tbody>
              </table>
              ${H(4, "Types d'arrosage", "أنواع السقي")}
              ${d.modes.length ? `<table><thead><tr>${th("Mode", "الوضع")}${th("Nombre", "العدد", 1)}${th("Durée", "المدة", 1)}</tr></thead>
                <tbody>${d.modes.map((m) => `<tr><td>${esc((modeName[m.mode] || [m.mode])[0])} · <span class="ar">${esc((modeName[m.mode] || [, ""])[1])}</span></td><td class="n">${m.n}</td><td class="n">${esc(dur(m.s))}</td></tr>`).join("")}</tbody></table>`
                : empty("Aucun arrosage sur la période.", "لا يوجد سقي في هذه الفترة.")}
            </div>
            <div>
              ${H(5, "Santé des cultures", "صحة المزروعات")}
              ${(d.diseases || []).length ? d.diseases.map((x) => { const [fr, ar] = split(x.label);
                return `<div class="risk ${esc(x.level)}"><span>${esc(fr)}${ar ? ` · <span class="ar">${esc(ar)}</span>` : ""}</span><span class="bar2"><i style="width:${Math.max(2, x.risk)}%"></i></span><b>${num(x.risk)} %</b></div>`; }).join("")
                : empty("Risques calculés dès que le boîtier envoie ses mesures.", "تُحسب المخاطر بمجرد أن يرسل الجهاز قياساته.")}
              ${H(6, "Diagnostics photo", "تشخيص الصور")}
              ${(d.diagnoses || []).length ? `<table><thead><tr>${th("Date", "التاريخ")}${th("Résultat", "النتيجة")}</tr></thead><tbody>${d.diagnoses.map((p) => {
                  const res = p.name_fr ? `${esc(p.name_fr)} (${p.confidence} %)${p.name_ar ? ` · <span class="ar">${esc(p.name_ar)}</span>` : ""}`
                    : p.status === "sain" ? 'Plante saine · <span class="ar">نبات سليم</span>'
                    : p.colors ? `Couleurs : jaune ${num(p.colors.yellow)} %, brun ${num(p.colors.brown)} % · <span class="ar">تحليل الألوان</span>` : "—";
                  return `<tr><td style="white-space:nowrap">${esc(dFR(p.ts * 1000, { day: "numeric", month: "short" }))}</td><td>${res}</td></tr>`; }).join("")}</tbody></table>`
                : empty("Aucune photo analysée sur la période.", "لا توجد صور محللة في هذه الفترة.")}
              ${H(7, "Alertes", "التنبيهات")}
              ${d.alerts.length ? `<table><tbody>${d.alerts.slice(0, 12).map((a) => `<tr><td style="width:62px;white-space:nowrap">${esc(dFR(a.ts * 1000, { day: "numeric", month: "short" }))}</td><td>${esc(a.title)}</td></tr>`).join("")}</tbody></table>`
                : empty("Aucune alerte sur la période.", "لا توجد تنبيهات في هذه الفترة.")}
            </div>
          </div>

          ${H(8, "Recommandations", "التوصيات")}
          ${recos(d)}

          ${H(9, "Hypothèses de calcul", "فرضيات الحساب")}
          <div class="two" style="gap:6mm">
            <p class="note">Débit de la pompe ${num(s.pump_flow_lpm, 1)} L/min · puissance ${num(s.pump_power_kw, 2)} kW · eau ${num(s.water_price_m3, 2)} ${esc(c)}/m³ · électricité ${num(s.electricity_price_kwh, 2)} ${esc(c)}/kWh. Modifiables dans Réglages › Coûts.</p>
            <p class="note ar">صبيب المضخة ${num(s.pump_flow_lpm, 1)} ل/د · القدرة ${num(s.pump_power_kw, 2)} كيلوواط · الماء ${num(s.water_price_m3, 2)} ${esc(c)}/م³ · الكهرباء ${num(s.electricity_price_kwh, 2)} ${esc(c)}/كيلوواط ساعي. قابلة للتعديل في الإعدادات › التكاليف.</p>
          </div>

          <div class="sign">
            <div>${bi("Visa de l'exploitant", "توقيع الفلاح")}</div>
            <div>${bi("Visa du technicien agricole", "توقيع التقني الفلاحي")}</div>
          </div>
          <div class="foot">
            <span><img src="logo.svg" alt="">Sāqiya · startup algérienne de l'irrigation intelligente</span>
            <span>${esc(d.report_id)}</span>
            <span class="ar">الساقية · شركة ناشئة جزائرية للسقي الذكي</span>
          </div>
        </div>`;
    }
    $("#go").addEventListener("click", () => { history.replaceState(null, "", `?from=${$("#from").value}&to=${$("#to").value}`); load(); });
    $("#print").addEventListener("click", () => window.print());
    load();
  })();
  </script>
</body>
</html>
